[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "profilometer-validation"
version = "1.0.0"
description = "Smartphone-vs-profilometer matching, validation stats and figures (study 2026-08-20, reused by the web admin)"
requires-python = ">=3.12"
# Floors mirror analyzer/pyproject.toml — the study reuses the analyzer's
# numeric stack and is installed into the same environment.
dependencies = [
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scipy>=1.16.0",
    "matplotlib>=3.10.0",
    "scienceplots>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
